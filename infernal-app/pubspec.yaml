name: infernal_wheel
description: "-1+ — habit tracker & addiction monitor"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local HTTP server + WebView (core architecture)
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  webview_flutter: ^4.10.0

  # Security — AES-256-GCM + Android Keystore
  flutter_secure_storage: ^9.2.2
  pointycastle: ^3.9.1
  crypto: ^3.0.5

  # Health Connect (sleep data from Samsung Health)
  health: 13.1.4

  # Storage
  path_provider: ^2.1.1

  # Utils
  # BUG+049 fix: was 'any' which would let dart pub upgrade pick up any
  # future breaking version silently. Pinned to caret range like the
  # other dependencies for reproducible builds. flutter_localizations
  # from the SDK pins intl at 0.20.2 — our range must include that.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/web/
