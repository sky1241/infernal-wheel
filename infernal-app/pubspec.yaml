name: infernal_wheel
description: App de suivi d'addictions avec integration montres connectees
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6

  # Health data (HealthKit + Health Connect)
  health: ^13.1.4

  # Storage local
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # State management
  provider: ^6.1.1

  # Utils
  intl: any
  share_plus: ^7.2.1

  # Local HTTP server + WebView
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  webview_flutter: ^4.10.0

  # Security — AES-256 encryption + secure key storage
  flutter_secure_storage: ^9.2.2
  pointycastle: ^3.9.1
  crypto: ^3.0.5

  # Background service (timer must survive app backgrounding)
  flutter_foreground_task: ^8.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/web/

  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
